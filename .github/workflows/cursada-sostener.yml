# Cursada: cuenta las horas de trabajo del proyecto desde el historial de commits de cursada/
# y actualiza cursada/datos/sostener.json (lo muestra la pantalla «Cómo se sostiene»).
# Corre en los servidores de GitHub. Solo commitea si los datos cambiaron.
name: Cursada - horas de trabajo

on:
  schedule:
    - cron: "37 11 * * 1"   # lunes, 8:37 de Buenos Aires
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cursada-sostener
  cancel-in-progress: false

jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hace falta todo el historial para contar los commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contar las horas
        run: python .github/scripts/cursada_sostener.py
      - name: Publicar si hubo cambios
        run: |
          git add cursada/datos/sostener.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Cursada: horas de trabajo actualizadas"
            git push
          fi
