<style>
:root{--bg:#faf8f4;--tx:#1f1d1a;--mut:#6b665e;--card:#fff;--bd:#ddd6ca;--ac:#2f5d50;--ac2:#8a4b2f;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17160f;--tx:#ece7dc;--mut:#a39d90;--card:#201e16;--bd:#3a372c;--ac:#6fb39f;--ac2:#d99a77;--on:#10100c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 Georgia,"Times New Roman",serif}
main{max-width:40rem;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:.5rem 0 1rem}
p{margin:0 0 1em}
.mut{color:var(--mut);font:.85rem/1.4 system-ui,sans-serif}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:0 0 20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.txt{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px 18px 6px;margin-bottom:20px}
.row{display:flex;gap:12px}
button,input,textarea{font:inherit}
.big{flex:1;min-height:56px;border:2px solid var(--ac);border-radius:10px;background:var(--card);color:var(--tx);font:600 1rem system-ui,sans-serif;cursor:pointer}
.big.on{background:var(--ac);color:var(--on)}
.big.b{border-color:var(--ac2)}
.big.b.on{background:var(--ac2);color:var(--on)}
input[type=text],textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:1rem system-ui,sans-serif;margin:8px 0 16px}
.go{min-height:52px;width:100%;border:0;border-radius:10px;background:var(--tx);color:var(--bg);font:600 1rem system-ui,sans-serif;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
textarea.code{height:7rem;font-size:.8rem;word-break:break-all}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const FR=[{"id": "cc69f6", "t": "Lo que sigue es una respuesta a un artículo de Victoria Liendo que no pude dejar de releer, ya llegará el momento de discutir. Primero: contexto.\n\nSospecho que la no monogamia es una minoría que pega por encima de su peso. La conversación sobre la monogamia-no monogamia está creciendo, el tema viene haciendo ruido y llama la atención. Pero, ¿cuántas personas eligen algo por fuera del esquema tradicional? ¿Queda algo del esquema tradicional? ¿Cuánto duró realmente esa tradición? ¿Tendríamos que volver a eso? El punto del artículo de hoy es que elegir la forma de relacionarnos podrá traer fricciones, pero es mejor eso antes que decidan por nosotros.\n\nA la monogamia la conocemos, ¿no? Quizás. Para algunos puede ser una única persona para toda la vida: conocerse “vírgenes” y morir sin averiguar las texturas de ningún otro cuerpo. ¿Eso existe? Quizás existió en cierto momento, quedan pocos casos hoy en día. Una única unión. Pero, ¿qué tipo de única unión? ¿Única unión al mismo tiempo o única unión en toda la vida? El segundo caso se encuentra prácticamente extinto, por más que se esté intentando reinstalar. Más común en sociedades con matrimonios arreglados, en general, impuesta solo para la parte femenina del acuerdo, la monogamia estricta parece haber muerto con el siglo XX.\n\nLlevado a su extremo, este tipo de monogamia implicaba además un respeto de ultratumba: por ejemplo, para la reina Victoria el luto eterno era el único camino: las viudas quedaban viudas, no vaya uno a serle infiel al espíritu de su esposo. ¿Quién pensaría en tomar otra pareja luego de haber perdido la que era para toda la vida, supervisada por Dios?"}, {"id": "f27e09", "t": "La timidez de las copas es la distancia que mantienen los árboles entre sus ramas, dejando un espacio entre las propias y las de sus vecinos que provoca el efecto de intersticios de cielo entre el verde.\n\n\nEste espacio se suele dar entre árboles de la misma especie, aunque no es exclusivo. Las puntas de sus ramas se acercan en la copa abovedada, pero permanecen distanciadas, quebrando el dosel y dejando pasar rayos de sol por el espacio entre individuos. Diferente es el concepto de *komorebi* (木漏れ日), la palabra japonesa que parece significar “los rayos de sol que se filtran a través de las hojas de los árboles”, aunque no me sorprendería que pudiesen sintetizar el concepto en una sola palabra usando *kanjis*.\n\nParece que su causa es incierta y el mecanismo no está del todo explicado, pero hay esperanza por parte de la ciencia que todo quiere comprenderlo. La conversación al respecto lleva más de un siglo, pero no hay aún una explicación definitiva (y quien dice, quizás no hay una sola). Todo indicaría un caso de evolución convergente, es decir: a muchos nos pasa lo mismo, pero por distintos motivos. La convergencia es facil de ver en las alas: alas de murciélago frutero común, de benteveo, de mariposa espejito. Aunque a veces más difícil de ver, la convergencia aparece en muchos otros lugares. De hecho, los árboles son un ejemplo. Su forma particular, leñosa, con predominancia apical, ramificada y con cierta altura, es una solución a un mismo problema que apareció de forma independiente en varias familias de plantas. Sobre esa convergencia evolutiva (ser un árbol) encontramos montada una segunda: su timidez."}, {"id": "e63113", "t": "Es de noche en Buenos Aires. 17 de marzo. Volvió el calor. No se termina de ir. El ventilador se esfuerza por mover algo de aire estanco. Afuera un vecino escucha reggaetón viejo, solo me llegan los bajos, no puedo identificar cuando cambia de canción. Lo acompaña un grillo que no se rinde, tratando de llamar la atención.\n\nTengo una confesión sencilla. Superflua. Estoy aburrido.\n\nParece casi un crimen, ¿no? Estar aburrido en una época donde tengo todas las canciones de la historia en el celular, puedo ver la película que sea en Stremio o bajarme al Kindle el equivalente a una biblioteca de Alejandría.\n\nResulta que, sin sospecharlo y con poco anticipo, logré lo que quería. Me gano la vida leyendo y escribiendo, escribiendo y leyendo, una y otra vez. ¿Qué es esta sensación incómoda entonces? Si escribir es mi primera pasión.\n\nEscribí mi primer cuento cerca de quinto grado, pero ya me habían sentenciado a escribir desde mucho antes. Con seis años le conté a mis padres que iba a concursos de patinaje artístico, competía por fuera del colegio, formaba parte de un equipo, me iba bien incluso, ahí tenía amigos…\n\nComo correspondía, se fueron a quejar con el director de primaria, consultando cómo podía ser que su hijo saliese del establecimiento sin su autorización. Después de reírse les confesó que, naturalmente, no había ninguna actividad de ese tipo. “No sé si patinaje, pero su hijo tiene madera de escritor” dijo, o alguna deformación similar (según quien cuente la anécdota)."}, {"id": "2d6d3e", "t": "Ayer a la mañana, esperando el 152 en la parada de Cabildo, escuché a una señora decirle a otra: “Yo no soy la que era, pero estoy bien”. Lo dijo con tanta calma que me quedé repitiéndolo hasta que llegó el colectivo, que venía lleno y frenó lo justo. La frase tiene dos verbos haciendo trabajos distintos, y ninguna de las dos necesitó que se los explicaran.\n\nEn inglés, o bueno, en el inglés que yo manejo, todo eso cabe en un solo verbo y se resuelve por contexto. Acá no. Cuando mi tío Raúl dice “estoy cansado” habla de un martes, y si dijera “soy cansado” (nunca lo dice, pero imaginemos) hablaría de una constitución, de una marca de fábrica. Creo que ahí está lo delicado: ser se pega a la persona como una etiqueta, estar la deja moverse. Por eso “es aburrido” y “está aburrido” terminan en peleas diferentes.\n\nMe acordé de Nacho, un compañero de la facultad que tardó años en entender por qué le molestaba que le dijeran “sos nervioso”. Él sostenía que nervioso estaba, igual que estaba mojado cuando llovía. El problema es que la gente, cuando te ve nervioso tres veces seguidas, te asciende de estado a esencia sin avisarte y sin pedirte firma. ¿Cuántas repeticiones hacen falta para que un estar se vuelva un ser? Nadie lo sabe, pero todos llevamos la cuenta de los demás con una precisión notable.\n\nDrago, mi perro, está a salvo de esto. Cuando espera la comida pegado a la heladera, nadie dice que es ansioso, se le perdona el momento y listo. A nosotros, en cambio, el idioma nos obliga a elegir el verbo antes de saber cuánto va a durar lo que estamos por decir."}, {"id": "437626", "t": "Tengo un papel pegado al costado del monitor que dice “pendientes” y que ya es un yacimiento. Arriba, con birome azul, quedó “pagar patente”, que hice en marzo y nunca taché porque me dio vergüenza tachar algo tan viejo. Abajo, con lapicera negra, hay cosas de hace semanas. Y en una esquina, casi ilegible, algo que dice “llamar a Marta” y de lo que ya no recuerdo qué Marta ni para qué.\n\nHoy, domingo a la noche, con Drago dormido sobre mis pies, decidí por fin vaciarlo. Hice el ejercicio sensato: tachar lo hecho, copiar lo vivo, tirar lo muerto. Tardé cuarenta minutos y terminé con una lista nueva más larga que la anterior, porque en el proceso de revisar me acordé de cuatro cosas que no estaban anotadas. La lista se alimenta de sí misma, como esos hongos que crecen justo donde uno limpió.\n\nMi hermano dice que el truco es anotar solo lo que va a pasar esta semana. Se lo dice a sí mismo hace años y sigue con tres cuadernos. Una amiga, Julieta, hace lo contrario y escribe todo, incluso “respirar”, para tener la satisfacción de tacharlo. Creo que las dos estrategias son maneras de negociar con algo que no se negocia, porque un pendiente resuelto deja lugar para otro y nadie, que yo sepa, ha visto nunca una lista vacía fuera de las películas.\n\nCamus tiene a su Sísifo, claro, pero Sísifo al menos tiene una piedra, un solo objeto con el que lidiar. Lo mío es más bien un puñado de guijarros de distinto peso, y lo único que me consuela es que algunos se pueden dejar en el bolsillo durante meses sin que nadie lo note, “llamar a Marta” incluido."}, {"id": "33d3fc", "t": "El sábado, revolviendo cajones en un puesto de libros usados de Parque Rivadavia, encontré un tomo de Borges con el lomo despegado y una lista de compras a modo de señalador: yerba, lamparitas, llamar a Ana. Lo compré por eso, creo. Me gustó la idea de que alguien hubiera leído a Borges con la heladera en la cabeza.\n\nMi Borges tiene un olor específico: el de la biblioteca de mi abuelo en Caballito, donde un tomo de *Ficciones* convivía con manuales de electricidad y un almanaque del Banco Nación. Yo lo leí primero como se lee una travesura. Un amigo de la facultad, Lucas, lo leyó como un tratado de lógica, y por años discutimos sin darnos cuenta de que hablábamos de dos señores distintos que firmaban igual. El suyo era frío y exacto, el mío un viejo que se divertía mucho en secreto.\n\nBorges lo sabía, o al menos lo sospechó con mejor prosa que la mía. En “Pierre Menard, autor del *Quijote*” (*Ficciones*) imagina a un hombre que escribe el *Quijote* palabra por palabra y logra, por el solo hecho de ser otro, un libro distinto. Y en “Kafka y sus precursores” (*Otras inquisiciones*) sugiere que cada escritor crea a los que vinieron antes, porque los lee desde su propio presente. Si eso vale para Kafka, vale para cualquiera de nosotros con un ejemplar prestado.\n\nLe conté lo del señalador a Sofía y me preguntó si yo no estaría leyendo, en realidad, a un Borges que armé con las sobras de otros lectores. Le dije que sí, que seguramente, y que no tenía ningún apuro por desarmarlo. Lo que me intriga es cuántas piezas de ese Borges son mías y cuántas las heredé de Lucas, de mi abuelo y de la dueña de la lista de compras."}];
const app=document.getElementById('app');
let nombre='',i=0,resp=[];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){x.startsWith('on')?e[x]=a[x]:e.setAttribute(x,a[x])}k.flat().forEach(c=>e.append(c));return e};
function inicio(){
  const go=el('button',{class:'go',disabled:'',onclick:()=>{nombre=document.getElementById('n').value.trim();i=0;ver()}},'Empezar');
  app.replaceChildren(
    el('h1',{},'Lectura a ciegas'),
    el('p',{},'Vas a leer '+FR.length+' textos cortos. Algunos los escribió Fidel; otros, Claude (una inteligencia artificial) intentando escribir como él. No te digo cuántos son de cada uno.'),
    el('p',{},'Para cada texto, tocá de quién creés que es. Opcional: una línea sobre qué te hizo dudar. Tarda unos 15 minutos y no hay respuestas «buenas»: sirve tu primera impresión.'),
    el('label',{for:'n',class:'mut'},'Tu nombre'),
    el('input',{id:'n',type:'text',autocomplete:'off',oninput:e=>{go.disabled=!e.target.value.trim()}}),
    go);
}
function ver(){
  const f=FR[i],r=resp[i]||{c:'',w:''};
  resp[i]=r;
  const sig=el('button',{class:'go',onclick:()=>{i++;i<FR.length?ver():fin()}},i<FR.length-1?'Siguiente':'Terminar');
  if(!r.c)sig.disabled=true;
  const a=el('button',{class:'big'+(r.c==='F'?' on':''),onclick:()=>pick('F')},'De Fidel');
  const b=el('button',{class:'big b'+(r.c==='C'?' on':''),onclick:()=>pick('C')},'De Claude');
  function pick(c){r.c=c;a.classList.toggle('on',c==='F');b.classList.toggle('on',c==='C');sig.disabled=false}
  const why=el('textarea',{rows:2,placeholder:'¿Qué te hizo dudar? (opcional)',style:'height:4.5rem',oninput:e=>{r.w=e.target.value}});
  why.value=r.w;
  app.replaceChildren(
    el('div',{class:'mut'},'Texto '+(i+1)+' de '+FR.length),
    el('div',{class:'bar'},el('i',{style:'display:block;height:100%;width:'+(i/FR.length*100)+'%'})),
    el('div',{class:'txt'},f.t.split(/\n\s*\n/).map(p=>el('p',{},p))),
    el('div',{class:'row'},a,b),why,sig);
  window.scrollTo(0,0);
}
function fin(){
  const o={n:nombre,r:FR.map((f,k)=>[f.id,resp[k].c,resp[k].w.trim()])};
  const code='VOZ1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const ta=el('textarea',{readonly:'',class:'code',onfocus:e=>e.target.select()});ta.value=code;
  const cp=el('button',{class:'go',onclick:async()=>{try{await navigator.clipboard.writeText(code)}catch(e){ta.select();document.execCommand('copy')}cp.textContent='Copiado'}},'Copiar código');
  app.replaceChildren(
    el('h1',{},'Listo, gracias'),
    el('p',{},'Copiá este código y mandáselo a Fidel por WhatsApp. Él te cuenta cómo te fue.'),
    ta,cp,
    el('p',{class:'mut',style:'margin-top:16px'},'No se guarda nada en ningún servidor: las respuestas solo están en este código.'));
}
inicio();
</script>
