  .sin-link { font: 17px/1.5 Georgia, serif; color: #22382C; max-width: 420px; margin: 0 auto; padding: 60px 24px; text-align: center; }
  .sin-link b { font-size: 2rem; display: block; margin-bottom: 12px; }

<body>
<!-- Versión instalable de Arboretum Ardeae. La app vive en Google Apps Script.
     Cada link lleva lo que necesita en el # (que nunca llega a GitHub): a=<código de la app> y, solo el de edición, k=<clave>.
     Se guardan en este dispositivo y se dejan en la URL para que "Agregar a pantalla de inicio" los conserve.
     Nada de esto está en el repositorio. -->
<noscript><div class="sin-link"><b>Arboretum Ardeae</b>Hace falta JavaScript para ver el arboretum.</div></noscript>
<script>
  const hash = location.hash;
  const ma = hash.match(/a=([A-Za-z0-9_-]+)/), mk = hash.match(/k=([A-Za-z0-9]+)/);
  let a = ma ? ma[1] : '', k = mk ? mk[1] : '';
  try {
    if (a) localStorage.setItem('arboretum.a', a); else a = localStorage.getItem('arboretum.a') || '';
    if (k) localStorage.setItem('arboretum.k', k); else k = localStorage.getItem('arboretum.k') || '';
  } catch (e) { }
  if (a && (!ma || (k && !mk))) history.replaceState(null, '', '#a=' + a + (k ? '&k=' + k : ''));
  if (a) {
    const f = document.createElement('iframe');
    f.src = 'https://script.google.com/macros/s/' + encodeURIComponent(a) + '/exec' + (k ? '?k=' + encodeURIComponent(k) : '');
    f.title = 'Arboretum Ardeae';
    f.allow = 'geolocation; clipboard-write';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="sin-link"><b>Arboretum Ardeae</b>Para entrar, abrí el link que te pasó Fidel.</div>';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
