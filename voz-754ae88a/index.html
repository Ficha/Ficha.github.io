<style>
:root{--bg:#faf8f4;--tx:#1f1d1a;--mut:#6b665e;--card:#fff;--bd:#ddd6ca;--ac:#2f5d50;--ac2:#8a4b2f;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17160f;--tx:#ece7dc;--mut:#a39d90;--card:#201e16;--bd:#3a372c;--ac:#6fb39f;--ac2:#d99a77;--on:#10100c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 Georgia,"Times New Roman",serif}
main{max-width:40rem;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:.5rem 0 1rem}
p{margin:0 0 1em}
.mut{color:var(--mut);font:.85rem/1.4 system-ui,sans-serif}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:0 0 20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.txt{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px 18px 6px;margin-bottom:20px}
.row{display:flex;gap:12px}
button,input,textarea{font:inherit}
.big{flex:1;min-height:56px;border:2px solid var(--ac);border-radius:10px;background:var(--card);color:var(--tx);font:600 1rem system-ui,sans-serif;cursor:pointer}
.big.on{background:var(--ac);color:var(--on)}
.big.b{border-color:var(--ac2)}
.big.b.on{background:var(--ac2);color:var(--on)}
input[type=text],textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:1rem system-ui,sans-serif;margin:8px 0 16px}
.go{min-height:52px;width:100%;border:0;border-radius:10px;background:var(--tx);color:var(--bg);font:600 1rem system-ui,sans-serif;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
textarea.code{height:7rem;font-size:.8rem;word-break:break-all}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
table.hs{width:100%;border-collapse:collapse;margin:0 0 20px;font:1rem system-ui,sans-serif}table.hs th,table.hs td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left}
</style>

<body>
<main id="app"></main>
<script>
const FR=[{"id": "e0ac47", "t": "Cuando escucho un álbum entero en el tren, de principio a fin, la ventanilla pasa a ser la segunda pantalla. La ciudad desfila a una velocidad que no es la de caminar ni la de leer. Entre medianeras, patios traseros y ropa tendida aparece algo que me interesa más de lo que debería: los carteles de «se alquila».\n\nCasi siempre, son iguales. Un fondo blanco, letras de imprenta, un teléfono. Alguien los pegó con cinta en un balcón o los colgó de una reja. Algunos están descoloridos por el sol, con el rojo convertido en rosa. Eso me dice algo sobre cuánto tiempo hace que nadie llama. Otros están nuevos. En un recorrido largo, se acumulan decenas y empiezan a parecer una especie de idioma.\n\nPienso en la palabra misma. Alquilar viene del árabe, de *al-kirā*, que es el arrendamiento, con ese «al» todavía pegado al principio, un fósil que nadie nota. Un cartel que dice «se alquila» es una de las pocas frases que una casa puede decir sobre sí misma. El resto del tiempo calla.\n\nNo sé quién vivió ahí antes. Eso es lo bueno de verlo de pasada: la ciudad se vuelve texto sin autor y uno lee fragmentos. Un balcón con macetas y un cartel. Una persiana baja. Una ventana abierta con una luz prendida a media tarde.\n\nDespués, el tren frena, se abren las puertas y el álbum va por la tercera canción. La ciudad que leí queda atrás, ya cambiada, porque dentro de unas semanas alguno de esos carteles habrá desaparecido y no me voy a enterar."}, {"id": "611ed6", "t": "Debería haberme dado cuenta de esto antes, reconozco. El mito de Sísifo (uno de mis monotemas) es parte esencial de mi forma de pensar el mundo. Pero, no sé porqué, por cual error en mi programación, ocurrió que no lo asumí hasta recién. La energía usada para ordenar un sistema siempre genera mayor desorden. El orden siempre es temporal y parcial. Siempre.\n\n8+8+8. 8 horas de trabajo honesto, 8 buenas horas de sueño 8, 8 horas de ocio. Es mi regla desde hace rato, aunque reconozco que mi ocio tiende a parecerse a mi trabajo. Sin embargo, a pesar de tener grabada esta consigna, por algún motivo creí que si ponía el esfuerzo suficiente la cantidad de horas que tendría que dedicarle al trabajo serían menos. A veces un glitch toma mi centro de procesamiento y me olvido de cosas básicas, en gran parte por eso empecé a meditar. Esta vez caí en el sueño de creer que finalmente terminaría con todo lo que tenía por hacer.\n\nNada más lejos de lo real. Más efectividad parece traer más trabajo. Una casilla de mails vacía dura una hora como mucho, ¿las aplicaciones de mensajes? Unos pocos minutos. La maldición de la efectividad parece ser estar destinado cada vez a aún más trabajo en un esquema de recompensas distorsivo. Mi algoritmo fue engañado.\n\nMientras escribo esto mi sistema visual está agotado, mi batería en modo de ahorro extremo y solo me activaría un llamado de emergencia. No parece ser indistinto para mi funcionamiento la intensidad de esas ocho horas. El apuro por “terminar todo lo que hay por hacer” me hizo correr en velocidad algo que creo debería ser más parecido a una maratón."}, {"id": "0e93ae", "t": "Hay un tablero de ajedrez de sesenta y cuatro casillas y seis tipos de pieza. Las reglas caben en una hoja. Eso lo vuelve engañoso. Uno las aprende en una tarde y cree que ya sabe jugar, hasta que pierde en doce jugadas contra alguien que parece no esforzarse.\n\nAprender de grande tiene sus problemas y también sus ventajas: los chicos absorben sin preguntar por qué, mientras que yo tengo que entender cada movimiento antes de aceptarlo, lo cual es lento pero a la vez me permite relacionar. Quizás por eso me gusta pensar que aprender ajedrez se parece a aprender las reglas de Dungeons & Dragons, que juego desde la facultad: las reglas importan poco, pero importa mucho lo que la mesa hace con ellas.\n\nHay un experimento viejo, de De Groot y después de Chase y Simon, que se cita siempre. A maestros y novatos se les muestra un tablero durante cinco segundos y luego se les pide reconstruirlo. Los maestros lo reproducen casi entero. Cuando las piezas están puestas al azar, en cambio, la ventaja desaparece. Los maestros ven las mismas casillas que el resto, pero además ven configuraciones que ya conocen, bloques que funcionan como palabras. Un maestro lee posiciones como yo leo una oración en castellano.\n\nEso me ordena un poco. Entonces, calcular más lejos importa menos que haber visto muchas partidas. Cuesta aceptar que haya que perder tanto para empezar a ver. Es un aprendizaje por acumulación, sin atajos que valgan, para el cual uno de grande, además, suele tener poca paciencia.\n\nTodavía no sé si vale la pena. Mientras tanto el tablero sigue ahí, con sus sesenta y cuatro casillas, esperando la primera jugada."}, {"id": "674696", "t": "La primera vez que no entendí un escrito, después de haber aprendido a leer, fue la descripción de una carta *Pokémon*. La había intercambiado solo en base a su dibujo, un hermoso Rhydon, sin darme cuenta de que no podía leer lo que estaba debajo. Me acuerdo de ponerla en mi mazo; solo sabía que era la evolución de otra que tenía y que los números prometían una buena carta. Entendía por homología e imágenes, el texto era incomprensible. Recuerdo ir corriendo a mi papá y preguntarle “¿qué quiere decir esto?, él me traducía directo al castellano. Cuantas más cartas intercambiaba, más letras aparecían ordenadas de forma insensata. Esta sensación se multiplicó el día que instalaron internet en casa.\n\nAllá por el 2003 se habría frente a mi un portal a un mundo de lengua desconocida. Todo compartía una estructura y se replicaba en esa misma organización; todo resultaba ilegible. Reconocía la diferencia de idiomas. Había aprendido el francés en jardín de infantes y razonaba: a la mañana francés, a la tarde castellano, en los jueguitos esta cosa rara. Recién en cuarto grado arranqué otro idioma: me dijeron que se llamaba inglés. El aprendizaje por comparación no parecía dar frutos, terminé mi primer trimestre con cuatro notas en grande:\n\nCabe aclarar que detestaba a mi maestra. Mi mamá procuró conseguirme otra. Empezamos con mi hermano (que siempre ligó de acompañante) dos horas por semana. Ahí comenzó mi agónico abandono de la lengua materna, aunque todavía conservaba un lugar exclusivo."}, {"id": "605986", "t": "Hace calor, Drago duerme debajo de la mesa y yo miro en la pantalla la foto satelital de un río que no conozco. Hace curvas absurdas. Un tramo parece escrito por alguien que se distrajo, con lazos que casi se tocan por el cuello. Me pregunto por qué un río, que baja porque la pendiente lo manda, no baja derecho.\n\nLa respuesta corta es que cualquier curva mínima se agranda sola. Donde el agua dobla, corre más rápido por afuera, así que roba orilla de ese lado. Por adentro se frena y deja el sedimento que traía. La orilla externa retrocede, la interna avanza, la curva se acentúa. Nadie la planea. Es retroalimentación pura, el mismo mecanismo que, en biología, aparece en cualquier cosa que se amplifica a sí misma.\n\nAlbert Einstein escribió en 1926, para mi sorpresa, un artículo sobre esto. Lo disparó una observación de tazas de té: las hojas se juntan en el centro del fondo cuando uno revuelve, por una corriente secundaria que gira pegada al vaso. Con esa idea, explicó por qué los ríos serpentean. Me gusta que el hombre de la relatividad se detuviera frente a una taza. Creo que ahí hay una forma de mirar que a mí me falta.\n\nLos meandros terminan por cortarse. Dos lazos se acercan hasta que el agua cruza el cuello en una crecida. El lazo abandonado queda como una laguna en forma de herradura. Los geógrafos la llaman brazo muerto, que a mí me suena a diagnóstico. Después, el río empieza de nuevo, con una curva nueva en otro lado.\n\nQuizás, lo que más me llama la atención, es que el desorden sale de una regla simple. Ningún río sabe que serpentea. Drago se estira, se da vuelta y sigue durmiendo."}, {"id": "797135", "t": "De chico visité Dachau. Quince años, no sé qué tan chico es eso, pero seguro antes de estar preparado. No porque en algún momento pudiese estarlo, es un antes y un después, cuando uno entiende ese fenómeno, no hay vuelta atrás. No voy a decir que lo entendí, creo que al día de hoy no lo hice; no paro de leer y ver cosas al respecto para hacerlo, pero no se si alguna vez me cabrá en la cabeza. En Dachau encerraron, torturaron y asesinaron personas desde 1933 hasta 1945, sin parar, sin piedad, sin un atisbo de humanidad.\n\nContrario a lo que esperaba, recuerdo poco de mi visita al campo; sé que fuimos en una camioneta. Al bajar ya se oía el silencio. Los grupos de visitantes se movían sin abrir la boca, cada tanto había un cruce de miradas: unos ojos vidriosos o directamente en llanto. Llevaba una campera, dos buzos y una remera térmica, de todas maneras aún recuerdo el frío. El frío y la piel de gallina. Debajo de tanto abrigo era más fácil ocultar la impresión que se manifiesta en el físico; escalofríos, pelos parados y un comienzo de bruxismo. Creo que pensé en el frío de esa gente, con esos harapos y las horas a la intemperie, esperando órdenes de la confabulación sádica de los SS. Pasados setenta y seis años todavía una corriente helada llega al presente."}];
const HS={"lectores": [{"n": "Alfredo", "a": 5, "k": 6, "aparte": false}, {"n": "Carmen", "a": 4, "k": 6, "aparte": false}, {"n": "Gabriela", "a": 4, "k": 6, "aparte": false}, {"n": "Gaspar", "a": 4, "k": 6, "aparte": false}, {"n": "Martina", "a": 4, "k": 6, "aparte": false}, {"n": "Sophie", "a": 4, "k": 6, "aparte": false}, {"n": "Azul", "a": 2, "k": 6, "aparte": false}, {"n": "Fidel", "a": 6, "k": 6, "aparte": true}], "textos": [{"fuente": "2026-03-11 amor", "autor": "fidel", "a": 5, "k": 7, "razones": [{"n": "Carmen", "ok": true, "por": "El uso de los signos de puntuación me genera dudas."}, {"n": "Martina", "ok": true, "por": "Recuerdo una anecdota en la cual me conto que habia escrito esto. Obviamente el estilo tambien lo reconozco pero supongo quw puede see imitado por claude"}, {"n": "Gaspar", "ok": true, "por": "''las viudas quedaban viudas, no vaya uno a serle infiel al espíritu de su esposo''\nSiento que esta frase implica una ironía no propia de la IA"}, {"n": "Gabriela", "ok": false, "por": "\"Pega por encima de su peso\""}]}, {"fuente": "2025-11-19 copas", "autor": "fidel", "a": 6, "k": 7, "razones": [{"n": "Martina", "ok": true, "por": "Ya lo lei"}]}, {"fuente": "2025-03-18 hobby", "autor": "fidel", "a": 3, "k": 7, "razones": [{"n": "Sophie", "ok": false, "por": "Fidel no es autoreferencial de forma directa, ni hace referencias espaciales o de contexto sin poetizar"}, {"n": "Martina", "ok": true, "por": "Suena como una situacion real de la vida de fidel"}, {"n": "Gaspar", "ok": false, "por": "Después de reírse les confesó que, naturalmente, no había ninguna actividad de ese tipo. “No sé si patinaje, pero su hijo tiene madera de escritor” dijo"}]}, {"fuente": "sos o estas", "autor": "claude", "a": 5, "k": 7, "razones": [{"n": "Sophie", "ok": true, "por": "Esto es re IA: La frase tiene dos verbos haciendo trabajos distintos, y ninguna de las dos necesitó que se los explicaran."}, {"n": "Fidel", "ok": true, "por": "la coma antes de \",y ninguna\". El tio Raúl y Nacho. \"sin perdirte firma\". Me gusta igual, se está acercando. Nadie diria que un perro es ansioso?"}, {"n": "Gabriela", "ok": true, "por": "\"Te asciende de estado a esencia sin avisarte y sin pedirte firma\""}]}, {"fuente": "pendientes", "autor": "claude", "a": 5, "k": 7, "razones": [{"n": "Sophie", "ok": false, "por": "Esta me hace dudar: Una amiga, Julieta, hace lo contrario y escribe todo, incluso “respirar”, para tener la satisfacción de tacharlo."}, {"n": "Fidel", "ok": true, "por": "\"yacimiento\", \"pagar patente\": no tengo auto. yo tacharía algo viejo aunque sea viejo. No me olvidaría qué Marta, si quizás el para qué. Cuidado con las estructuras de 3, acá funciona pero no abusar. Mi hermano no diría eso, no habla de organización. No tengo una amiga Julieta, pero entiendo a qué va. Guijarros me gusta, no sé si lo usaría, pero es buena imagen. la coma antes de \", y lo único\""}, {"n": "Martina", "ok": true, "por": "No sé, es muy parecido a tu estilo pero hay algunas cositas que son más genéricas y puede haber incluido claude"}, {"n": "Gaspar", "ok": true, "por": "Lo mío es más bien un puñado de guijarros de distinto peso, y lo único que me consuela es que algunos se pueden dejar en el bolsillo durante meses sin que nadie lo note,"}, {"n": "Gabriela", "ok": true, "por": "\"Puñado de guijarros\""}]}, {"fuente": "borges", "autor": "claude", "a": 3, "k": 7, "razones": [{"n": "Sophie", "ok": true, "por": "Dudo, algunos parecen medio datos de licuadora variada de personas y cosas de Fidel. (Llamar a Ana) Y a demás se que Fidel no tiene abuelo. Pero se acerca más a las demás cosas."}, {"n": "Carmen", "ok": false, "por": "No estoy para nada segura de nada. Que miedo."}, {"n": "Fidel", "ok": true, "por": "\"biblioteca en caballito\": no tuve abuelo y tampoco tuvo biblitoeca ni fue en caballito, manuales de electricidad y banco nación no suena a mi vida tampoco. \"Como se lee una travesura\" no diría jamás. No tengo un amigo Lucas. \", y por años\", esa coma te delata. \"El suyo era frío y exacto, el mío un viejo que se divertía mucho en secreto.\" no se porque pero me suena a IA. Quién es Sofía? Inventar nombres, lugares y personas en mi vida te delata."}, {"n": "Martina", "ok": false, "por": "La estructura de pensamiento se parece a como piensa fide"}]}], "total": [27, 42]};
const RONDA='2';
const app=document.getElementById('app');
let nombre='',i=0,resp=[];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){x.startsWith('on')?e[x]=a[x]:e.setAttribute(x,a[x])}k.flat().forEach(c=>e.append(c));return e};
function tablero(){
  const L=HS.lectores,T=HS.textos;
  const filas=L.map((h,k)=>el('tr',{},el('td',{},h.aparte?'–':String(k+1)),el('td',{},h.n+(h.aparte?' (sabía cuáles eran)':'')),el('td',{},h.a+' de '+h.k)));
  const tx=T.map(x=>el('div',{class:'txt'},
    el('p',{},el('b',{},x.fuente),' · de '+(x.autor==='fidel'?'Fidel':'Claude')+' · lo acertaron '+x.a+' de '+x.k),
    x.razones.map(r=>el('p',{class:'mut'},el('b',{},r.n),(r.ok?' ✓ ':' ✗ ')+r.por))));
  app.replaceChildren(
    el('h1',{},'Ronda 1: los resultados'),
    el('p',{},'Entre todos acertaron '+HS.total[0]+' de '+HS.total[1]+' (el azar da la mitad). Más aciertos, mejor ojo.'),
    el('table',{class:'hs'},el('tr',{},el('th',{},'#'),el('th',{},'Lector'),el('th',{},'Aciertos')),filas),
    el('h2',{},'Qué pensaron de cada texto'),...tx,
    el('p',{},'Claude volvió a intentarlo con unas reglas nuevas. ¿Te animás a una segunda ronda?'),
    el('button',{class:'go',onclick:inicio},'Sí, vamos'));
}
function inicio(){
  const go=el('button',{class:'go',disabled:'',onclick:()=>{nombre=document.getElementById('n').value.trim();i=0;ver()}},'Empezar');
  app.replaceChildren(
    el('h1',{},'Lectura a ciegas'),
    el('p',{},'Vas a leer '+FR.length+' textos cortos. Algunos los escribió Fidel; otros, Claude (una inteligencia artificial) intentando escribir como él. No te digo cuántos son de cada uno.'),
    el('p',{},'Para cada texto, tocá de quién creés que es. Opcional: una línea sobre qué te hizo dudar. Tarda unos 15 minutos y no hay respuestas «buenas»: sirve tu primera impresión.'),
    el('label',{for:'n',class:'mut'},'Tu nombre'),
    el('input',{id:'n',type:'text',autocomplete:'off',oninput:e=>{go.disabled=!e.target.value.trim()}}),
    go);
}
function ver(){
  const f=FR[i],r=resp[i]||{c:'',w:''};
  resp[i]=r;
  const sig=el('button',{class:'go',onclick:()=>{i++;i<FR.length?ver():fin()}},i<FR.length-1?'Siguiente':'Terminar');
  if(!r.c)sig.disabled=true;
  const a=el('button',{class:'big'+(r.c==='F'?' on':''),onclick:()=>pick('F')},'De Fidel');
  const b=el('button',{class:'big b'+(r.c==='C'?' on':''),onclick:()=>pick('C')},'De Claude');
  function pick(c){r.c=c;a.classList.toggle('on',c==='F');b.classList.toggle('on',c==='C');sig.disabled=false}
  const why=el('textarea',{rows:2,placeholder:'¿Qué te hizo dudar? (opcional)',style:'height:4.5rem',oninput:e=>{r.w=e.target.value}});
  why.value=r.w;
  app.replaceChildren(
    el('div',{class:'mut'},'Texto '+(i+1)+' de '+FR.length),
    el('div',{class:'bar'},el('i',{style:'display:block;height:100%;width:'+(i/FR.length*100)+'%'})),
    el('div',{class:'txt'},f.t.split(/\n\s*\n/).map(p=>el('p',{},p))),
    el('div',{class:'row'},a,b),why,sig);
  window.scrollTo(0,0);
}
function fin(){
  const o={n:nombre,r:FR.map((f,k)=>[f.id,resp[k].c,resp[k].w.trim()])};
  const code='VOZ'+RONDA+':'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const ta=el('textarea',{readonly:'',class:'code',onfocus:e=>e.target.select()});ta.value=code;
  const cp=el('button',{class:'go',onclick:async()=>{try{await navigator.clipboard.writeText(code)}catch(e){ta.select();document.execCommand('copy')}cp.textContent='Copiado'}},'Copiar código');
  app.replaceChildren(
    el('h1',{},'Listo, gracias'),
    el('p',{},'Copiá este código y mandáselo a Fidel por WhatsApp. Él te cuenta cómo te fue.'),
    ta,cp,
    el('p',{class:'mut',style:'margin-top:16px'},'No se guarda nada en ningún servidor: las respuestas solo están en este código.'));
}
HS.lectores?tablero():inicio();
</script>

</html>
