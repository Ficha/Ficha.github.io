<body>
<!-- Versión instalable de Quests (Fidel y Sophie). La app vive en Google Apps Script.
     Cada uno entra con su link personal: ficha.github.io/quests/#k=<clave>.
     La clave va en el # para que nunca llegue a GitHub; se guarda en este dispositivo
     y queda en la URL para que "Agregar a pantalla de inicio" la conserve. -->
<script>
  const APP = 'https://script.google.com/macros/s/AKfycbxHnWzODuHQhYywoz9DtEc5xhxf_zR143nK6IX4V9rNX6fZShWDV3mbgAjp7UwINYa3/exec';
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  let k = m ? m[1] : '';
  try {
    if (k) localStorage.setItem('quests.k', k);
    else k = localStorage.getItem('quests.k') || '';
  } catch (e) { }
  if (k && !m) history.replaceState(null, '', '#k=' + k);
  if (k) {
    const f = document.createElement('iframe');
    f.src = APP + '?k=' + encodeURIComponent(k);
    f.title = 'Quests';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="sin-clave"><b>⭐</b>Para entrar, abrí el link personal que te pasó Fidel.</div>';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
