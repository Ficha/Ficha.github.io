<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Diario de escritura</title>
<meta name="theme-color" content="#3f5c42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1c1710; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  a.fuera { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 1;
    font: 12px/1 system-ui, sans-serif; color: #eae3cf; background: #3f5c42cc; padding: 6px 8px;
    border-radius: 6px; text-decoration: none; opacity: .5; }
  a.fuera:hover, a.fuera:focus { opacity: 1; }
  @media (max-width: 800px) { a.fuera { bottom: calc(76px + env(safe-area-inset-bottom)); } }
  #avisos { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 2;
    font: 600 14px/1 system-ui, sans-serif; color: #fff; background: #ff8a00; border: 0; border-radius: 999px;
    padding: 12px 18px; box-shadow: 0 4px 14px #0006; cursor: pointer; max-width: calc(100% - 32px); }
  #avisos:disabled { opacity: .8; cursor: default; }
  #avisos[hidden] { display: none; }
</style>
</head>
<body>
<!-- Versión instalable del Diario de escritura: abre la web app de Apps Script (solo accesible con la cuenta de Fidel). -->
<iframe src="https://script.google.com/macros/s/AKfycbz41PovgCJjIJVIjbr2u27zfs6OsXy_xJOfJfGG-JfUwTEqfoDF9pI3PPuxwLgRiBGq/exec" title="Diario de escritura" allow="clipboard-write"></iframe>
<button id="avisos" type="button" hidden>🔔 Activar avisos de racha</button>
<a class="fuera"href="https://script.google.com/macros/s/AKfycbz41PovgCJjIJVIjbr2u27zfs6OsXy_xJOfJfGG-JfUwTEqfoDF9pI3PPuxwLgRiBGq/exec" target="_blank" rel="noopener" title="Si no carga (por ejemplo, pide iniciar sesión), abrila en una pestaña">↗</a>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  // Racha en el ícono, al estilo Duolingo. La app (dentro del iframe) manda {tipo:'diario-racha', racha, hoy, fecha}.
  // - Número en el ícono de la barra de tareas (Badging API, app instalada en Chrome/Edge).
  // - Ícono de la ventana y título con color: naranja = hoy ya escribiste; gris = la racha espera que escribas hoy.
  const NARANJA = '#ff8a00', GRIS = '#8a8f98';
  const TITULO = 'Diario de escritura';
  const base = new Image();
  base.src = 'icono-192.png';

  function isoLocal(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Lo guardado puede ser de otro día: ajusta la racha a hoy hasta que la app avise.
  function alDia(e) {
    const hoy = new Date(), ayer = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 1);
    if (e.fecha === isoLocal(hoy)) return e;
    const sigue = (e.fecha === isoLocal(ayer) && e.hoy) ? e.racha : 0;
    return { racha: sigue, hoy: false, fecha: isoLocal(hoy) };
  }

  function dibujarIcono(e) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    if (base.complete && base.naturalWidth) x.drawImage(base, 0, 0, 64, 64);
    if (e.racha > 0) {
      const txt = e.racha > 999 ? '999+' : String(e.racha);
      x.font = 'bold 26px system-ui, sans-serif';
      const w = Math.max(34, x.measureText(txt).width + 14);
      x.fillStyle = e.hoy ? NARANJA : GRIS;
      x.strokeStyle = '#ffffff';
      x.lineWidth = 3;
      x.beginPath();
      x.roundRect(64 - w, 30, w, 34, 17);
      x.fill();
      x.stroke();
      x.fillStyle = '#ffffff';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText(txt, 64 - w / 2, 48);
    }
    let link = document.querySelector('link[rel="icon"]');
    link.type = 'image/png';
    link.href = c.toDataURL('image/png');
  }

  function mostrarRacha(e) {
    e = alDia(e);
    dibujarIcono(e);
    document.title = e.racha > 0 ? (e.hoy ? '🔥 ' : '⏳ ') + e.racha + ' · ' + TITULO : TITULO;
    try {
      if (e.racha > 0 && navigator.setAppBadge) navigator.setAppBadge(e.racha).catch(() => {});
      else if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
    } catch (err) { }
  }

  let ultima = null;
  try { ultima = JSON.parse(localStorage.getItem('diario-racha') || 'null'); } catch (err) { }
  // Al abrir, muestra la última racha conocida; si el aviso llegó antes que la imagen, redibuja con el plumín.
  base.onload = () => { if (ultima) mostrarRacha(ultima); };
  if (ultima && base.complete) mostrarRacha(ultima);

  window.addEventListener('message', ev => {
    // La web app de Apps Script corre en un iframe de *.googleusercontent.com.
    if (!/^https:\/\/[\w-]+\.googleusercontent\.com$/.test(ev.origin)) return;
    const d = ev.data;
    if (d && d.tipo === 'diario-push-ok') { window.dispatchEvent(new CustomEvent('diario-push-ok', { detail: d })); return; }
    if (!d || d.tipo !== 'diario-racha' || typeof d.racha !== 'number' || typeof d.fecha !== 'string') return;
    // La ventana de la app: a ella se le manda el token de notificaciones.
    window.diarioApp = { win: ev.source, origin: ev.origin };
    ultima = { racha: Math.max(0, Math.floor(d.racha)), hoy: !!d.hoy, fecha: d.fecha };
    try { localStorage.setItem('diario-racha', JSON.stringify(ultima)); } catch (err) { }
    mostrarRacha(ultima);
  });
</script>
<script type="module">
  // Avisos de racha por notificación push (Firebase Cloud Messaging), pensado para Android.
  // El botón pide el permiso, obtiene el token del dispositivo y se lo pasa a la app, que lo guarda
  // y manda una notificación de prueba. A las 21, si no escribiste, el diario manda el aviso.
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getMessaging, getToken, isSupported } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyACBZt--0BMLK83SUxxfw8UB9G4428Vquw',
    authDomain: 'diario-escritura.firebaseapp.com',
    projectId: 'diario-escritura',
    storageBucket: 'diario-escritura.firebasestorage.app',
    messagingSenderId: '413843837113',
    appId: '1:413843837113:web:21e74157f0b106a6af0b68'
  };
  const VAPID = 'BGrOncNWo9Z4HXDTAZgUpWmTHwXQJmrvInPy-F5CRejpoFerrwJYkZEKTzINmj5GRaOOZND7PVt34qEz2znuJWA';

  const btn = document.getElementById('avisos');
  const guardado = () => { try { return localStorage.getItem('diario-push-ok') || ''; } catch (e) { return ''; } };

  async function iniciar() {
    if (!('Notification' in window) || !(await isSupported().catch(() => false))) return;
    if (Notification.permission === 'denied') return;
    const messaging = getMessaging(initializeApp(firebaseConfig));
    const reg = await navigator.serviceWorker.register('sw.js');

    // prueba = true al tocar el botón: la app manda una notificación de prueba.
    async function registrar(prueba) {
      const token = await getToken(messaging, { vapidKey: VAPID, serviceWorkerRegistration: reg });
      if (!token) throw new Error('Firebase no devolvió un token');
      if (!prueba && token === guardado()) return token;
      // Espera a que la app haya cargado (manda la racha al abrir).
      for (let i = 0; i < 60 && !window.diarioApp; i++) await new Promise(r => setTimeout(r, 500));
      if (!window.diarioApp) throw new Error('La app no terminó de cargar');
      window.diarioApp.win.postMessage({ tipo: 'diario-push-token', token, prueba: !!prueba }, window.diarioApp.origin);
      return token;
    }

    window.addEventListener('diario-push-ok', ev => {
      if (ev.detail.error) { btn.textContent = '⚠️ ' + ev.detail.error.slice(0, 60); btn.disabled = false; return; }
      try { localStorage.setItem('diario-push-ok', ev.detail.token); } catch (e) { }
      btn.hidden = true;
    });

    // Ya activado: renueva el token en silencio si Firebase lo cambió.
    if (Notification.permission === 'granted' && guardado()) {
      registrar(false).catch(() => {});
      return;
    }
    btn.hidden = false;
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Activando…';
      try {
        if (await Notification.requestPermission() !== 'granted') { btn.textContent = 'Sin permiso de notificaciones'; return; }
        await registrar(true);
      } catch (e) { btn.textContent = '⚠️ ' + String(e.message || e).slice(0, 60); btn.disabled = false; }
    };
  }
  iniciar();
</script>
</body>
</html>
